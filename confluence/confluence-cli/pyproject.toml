[project]
name = "confluence-cli"
version = "0.1.0"
description = "Agent-facing CLI for Confluence Cloud: spaces, pages, attachments, and bundle publishing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]
keyring = [
    "keyring>=25",
]
markdown = [
    "markdownify>=0.13",
]

[project.scripts]
confluence = "confluence_cli.cli:entrypoint"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "PLE", "PLW", "RUF"]
ignore = [
    "E501",
    "BLE001",
    "S310",
    "UP042",
    "PLW0108",
    "RUF001",
    "RUF005",
]
external = ["S310", "S320"]
