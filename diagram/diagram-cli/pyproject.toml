[project]
name = "diagram-cli"
version = "0.1.0"
description = "Agent-facing CLI for rendering PlantUML, Mermaid, GraphViz, D2 and other diagrams via the Kroki HTTP API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.scripts]
diagram = "diagram_cli.cli:entrypoint"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"
