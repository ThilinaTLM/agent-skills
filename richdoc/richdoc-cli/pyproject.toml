[project]
name = "richdoc-cli"
version = "0.4.0"
description = "Agent-facing CLI for scaffolding and validating richdoc HTML documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "lxml>=5.2",
]

[project.scripts]
richdoc = "richdoc_cli.cli:entrypoint"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"
