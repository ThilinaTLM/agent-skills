name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: richdoc-cli (lint + type + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: richdoc/richdoc-cli
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Sync (with dev extras)
        run: uv sync --extra dev

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Mypy (type-check)
        run: uv run mypy src

      - name: Pytest (snapshots + units)
        # `-ra` surfaces a short summary of failing/skipped tests at the end.
        # Snapshots must match exactly; CI never auto-updates.
        run: uv run pytest -ra

  lib:
    name: richdoc-lib (biome + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: richdoc/richdoc-lib
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: richdoc/richdoc-lib/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Biome (lint + format check)
        run: pnpm exec biome check .

      - name: Tsc (type-check, no emit)
        run: pnpm exec tsc --noEmit

      # The lib build runs `richdoc lint examples/showcase.html` against the
      # freshly-emitted schema. That requires the CLI launcher (which runs
      # via `uv run`), so we install uv here too.
      - name: Install uv (for sanity check)
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Sync CLI (so build's sanity check can call it)
        working-directory: richdoc/richdoc-cli
        run: uv sync

      - name: pnpm build
        run: pnpm build
